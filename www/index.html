<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Light</title>
<meta name="description" content="An alarm that makes you prove you're up.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' https://sdk.scdn.co https://open.spotify.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://open.spotify.com https://sdk.scdn.co https://www.youtube.com https://www.youtube-nocookie.com https://www.instagram.com; connect-src 'self' https: wss://*.spotify.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; font-src 'self' data:;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="First Light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/bodoni-moda-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/capacitor.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Each container is filled by its own module in js/ui/. -->
  <header id="appbar" class="appbar"></header>
  <div id="drawer" class="hidden"></div>
  <main>
    <section data-tab="alarm"></section>
    <section data-tab="tasks" class="hidden"></section>
    <section data-tab="sounds" class="hidden"></section>
    <section data-tab="progress" class="hidden"></section>
    <section data-tab="settings" class="hidden"></section>
  </main>
  <nav class="tabs"></nav>

  <div id="night" class="hidden"></div>
  <div id="morning" class="hidden"></div>
  <div id="media-stage" class="hidden"></div>
  <div id="camera" class="hidden"></div>
  <div id="boost" class="hidden"></div>
  <div id="checkin" class="hidden"></div>
  <div id="nap" class="hidden"></div>
  <noscript><p style="padding:24px">First Light needs JavaScript to run.</p></noscript>
</body>
</html>
